# configs/msm8937.conf — параметры SoC-платформы (переопределяются устройством).
#
# FD_BASE/FD_SIZE: куда BootShim копирует UEFI FD и сколько байт.
# Значения сняты с устройства: единственное свободное окно DDR между
# wcnss_fw (кончается на 0x8EA00000) и сплэшем (0x90000000) — 22 МиБ.
# Подтверждено /proc/iomem: System RAM 0x8EA00000-0xFFFFFFFF.
#
FD_BASE=0x8EA00000
FD_SIZE=0x00800000
