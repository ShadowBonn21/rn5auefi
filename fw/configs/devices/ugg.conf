# configs/devices/ugg.conf — Xiaomi Redmi Note 5A Prime (Snapdragon 435 / MSM8940)
#
# codename: ugg (ugglite = Redmi Note 5A на MSM8917 — НЕ этот конфиг)
# вариант:  4 GiB RAM / 64 GiB eMMC, панель 720x1280
#
SOC_PLATFORM="MSM8937"
VENDOR_NAME="Xiaomi"
PLATFORM_NAME="ugg"

# mkbootimg: LK на msm8937 понимает ТОЛЬКО legacy-заголовок v0 (без bootconfig).
BOOTIMG_OS_PATCH_LEVEL="2019-04"
BOOTIMG_OS_VERSION=9.0.0
BOOTIMG_HEADER_VERSION=0
